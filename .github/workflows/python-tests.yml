name: Python controller smoke tests

on:
  push:
    paths:
      - 'software/python/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'software/python/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controller test dependencies
        run: python -m pip install "numpy>=1.24,<3"
      - name: Run controller smoke tests
        run: python -m unittest discover -s tests -v
